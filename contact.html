<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اتصل بنا | دليل فعاليات الجامعة الافتراضية</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <nav class="navbar navbar-expand-lg navbar-light fixed-top">
      <div class="container">
        <a class="navbar-brand fw-bold text-primary" href="index.html">🎓 فعاليات SVU</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">الرئيسية</a></li>
            <li class="nav-item"><a class="nav-link" href="events.html">الفعاليات</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">عن الدليل</a></li>
            <li class="nav-item"><a class="nav-link active" href="contact.html">اتصل بنا</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container" style="margin-top: 100px;">
    <div class="row justify-content-center">
      <div class="col-md-8">
        <h2 class="mb-4 text-center">تواصل معنا أو اقترح فعالية</h2>
        
        <div id="formAlert" class="alert" style="display: none;" role="alert"></div>

        <form id="contactForm" class="card p-4 shadow-sm">
          <div class="mb-3">
            <label for="name" class="form-label">الاسم الكامل</label>
            <input type="text" class="form-control" id="name" placeholder="أدخل اسمك الثلاثي">
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">البريد الإلكتروني</label>
            <input type="email" class="form-control" id="email" placeholder="name@example.com">
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">نص الرسالة / تفاصيل الفعالية المقترحة</label>
            <textarea class="form-control" id="message" rows="4" placeholder="اكتب رسالتك هنا..."></textarea>
          </div>
          <button type="submit" class="btn btn-primary">إرسال الرسالة</button>
        </form>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-4 mt-5">
    <div class="container">
      <p class="mb-1">جميع الحقوق محفوظة © 2026 - دليل فعاليات الجامعة الافتراضية (SVU)</p>
      <p class="small text-muted mb-0">
        فريق العمل: 
        عبير الحميدي (329880) | 
        جودي قنبس (249053) | 
        غدي حمدان (287765) | 
        محمد زيادة (285145)
      </p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
